<html>
<head>
  <title>Lab 3 things </title>
  <script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol-layerswitcher/dist/ol-layerswitcher.css"/>
  <script src="https://cdn.jsdelivr.net/npm/ol-layerswitcher/dist/ol-layerswitcher.js"></script>
</head>
<body>
  <h3>Chapter 7: Web-based Mapping using OpenLayers</h3>
  <h4>Author:Alec M.</h4>
  <div id="map" class="map", style = "width:100%; height:100%"></div>
  <!--Note: Everything till 7.2.4 is correct-->
  <script>
  //setting location perameters
    //35.643541,-79.3881853 geographic center of NC
    //35.306840, -80.73200 UNCC Coords
    var latitude=35.343541;
    var longitude=-79.6881853;
    var latlong=ol.proj.fromLonLat([longitude,latitude]);
    var zoomLevel=8;

    var basegroup = new ol.layer.Group({
      'title': 'Base Maps',
      layers: []
    });

    var overlaygroup = new ol.layer.Group({
      'title': 'Overlay',
      layers:[]
    });
    
    var osm = new ol.layer.Tile({
      title: 'OpenStreetMap',
      type: 'base',
      visible: true,
      source: new ol.source.OSM()
    });
    basegroup.getLayers().push(osm);

    var googlemap = new ol.layer.Tile({
      title: 'Google Map',
      type: 'base',
      visible: true,
      source: new ol.source.XYZ({
        url:'https://mt{0-3}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&key=AIzaSyA1IY1QaM_3gcdAOzSD0kydkjyMSzhJIMg'
        })
    });
    basegroup.getLayers().push(googlemap);

    var wms1 = new ol.layer.Tile({
      title: 'Elevation',
      source: new ol.source.TileWMS({
        url: 'https://elevation.nationalmap.gov/arcgis/services/3DEPElevation/ImageServer/WMSServer',
        params:{'LAYERS': '3DEPElevation:Hillshade Elevation Tinted', 'TILED': true},
        transition: 0
      })
    });
    overlaygroup.getLayers().push(wms1);

    var wms2 = new ol.layer.Tile({
      title: 'Land Cover',
      source: new ol.source.TileWMS({
        url: 'https://www.mrlc.gov/geoserver/mrlc_display/NLCD_2021_Land_Cover_L48/wms',
        params: {'LAYERS': 'NLCD_2021_Land_Cover_L48', 'TILED': true},
        transition: 0
      })
    });
    overlaygroup.getLayers().push(wms2);

    var wms3 = new ol.layer.Tile({
      title: 'Floodplain Relisience',
      source: new ol.source.TileWMS({
        url: 'https://services.nconemap.gov/secure/services/Floodplain_Resilience/ImageServer/WMSServer?request=GetCapabilities&service=WMS',
        params: {'LAYERS': 'Floodplain_Resilience_RFT', 'TILED': true},
        transition: 0
      })
    });
    overlaygroup.getLayers().push(wms3);        

    var geojsonSource1 = new ol.source.Vector({
      url:'https://raw.githubusercontent.com/PublicaMundi/MappingAPI/refs/heads/master/data/geojson/us-states.json',
      format: new ol.format.GeoJSON()
    });

    var geojsonSource2 = new ol.source.Vector({
      url: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',
      format: new ol.format.GeoJSON()
    });

    var polygonStyle = new ol.style.Style({
      fill: new ol.style.Fill({
        color: 'rgba(0,0,0,0)'
      }),
        stroke: new ol.style.Stroke({
          color:'#B00B69',
          width: 2
        })
    });

    var geojsonLayer1 = new ol.layer.Vector({
      title: 'US States',
      source: geojsonSource1,
      style:polygonStyle
    });
    overlaygroup.getLayers().push(geojsonLayer1);

    var geojsonLayer2 = new ol.layer.Vector({
      title: 'Earthquake',
      source: geojsonSource2,
      style: new ol.style.Style({
        image: new ol.style.Circle({
          radius: 5,
          fill: new ol.style.Fill({color:'red'}),
          stroke: new ol.style.Stroke({
            color: 'black',
            width: 1
          })
        })
      })
    });
    overlaygroup.getLayers().push(geojsonLayer2);

    var map = new ol.Map({
      target: 'map',
      layers: [basegroup,overlaygroup],
        view: new ol.View({
          center: latlong,
          zoom: zoomLevel
      })
    });
   
    var layerSwitcher = new ol.control.LayerSwitcher({
      tipLabel: 'Legend'
    });

    map.addControl(layerSwitcher);
  </script>
</body>
</html>
